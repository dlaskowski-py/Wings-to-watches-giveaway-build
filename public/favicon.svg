<!--
  ADJL Technology mark on the kit's 32px artboard: porcelain ground, 6px
  radius, one bar width of clear space on every side.

  The geometry is derived from the same construction constants as the Mark
  component in src/components/brand.tsx (outer bar 1.0, centre 0.55, height
  3.67, gap 0.42, radius 0.22 x bar width) rather than drawn by hand, so the
  tab icon and the in-app mark are the same shape. src/components/brand.test.ts
  fails if the two drift apart.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#FAFAFC"/>
  <rect x="6.434" y="5.644" width="5.644" height="20.713" rx="1.242" fill="#0E1117"/>
  <rect x="14.448" y="5.644" width="3.104" height="20.713" rx="0.683" fill="#D9542A"/>
  <rect x="19.922" y="5.644" width="5.644" height="20.713" rx="1.242" fill="#0E1117"/>
</svg>
